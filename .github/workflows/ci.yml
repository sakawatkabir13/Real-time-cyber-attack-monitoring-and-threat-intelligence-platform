name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: vanguard_test_ci
          POSTGRES_USER: vanguard_test
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vanguard_test -d vanguard_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://vanguard_test:ci_only_password@localhost:5432/vanguard_test_ci
      VANGUARD_TEST_DATABASE_URL: postgresql+asyncpg://vanguard_test:ci_only_password@localhost:5432/vanguard_test_ci
      POSTGRES_PASSWORD: ci_only_password
      DATABASE_SSL: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
        working-directory: backend
      - run: alembic upgrade head
        working-directory: backend
      - run: python -m pytest -q tests
        working-directory: backend
      - run: python -m pip install -r agent/requirements.txt
      - run: python -m pytest -q agent/test_agent.py ops/test_monitor.py
      - run: python -m pip install pip-audit==2.9.0
      - run: pip-audit -r backend/requirements.txt

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
